name: Desktop platform qualification

# Validation-only fork PR. This does not alter upstream/default-branch CI,
# register runners, publish packages, deploy, or access repository secrets.
on:
  pull_request:
    branches: [task/8701-platform-qualification-base]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  changes:
    if: github.repository == 'seo-rii/rhwp' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.impact.outputs.windows }}
      macos: ${{ steps.impact.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /bindings/Flutter/tool/platform_qualification_paths.py
      - name: Select exact affected target inputs
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_REPOSITORY: ${{ github.repository }}
          QUALIFICATION_BEFORE: ${{ github.event.before }}
          QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -B bindings/Flutter/tool/platform_qualification_paths.py
          --repository "$QUALIFICATION_REPOSITORY"
          --before "$QUALIFICATION_BEFORE"
          --head "$QUALIFICATION_HEAD"

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    concurrency:
      group: desktop-qualification-windows-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_VERSION_PIN: c197ca5199e9ee5661e865596c9c07294dfab51c
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /.cargo/
            /src/
            /crates/
            /tools/
            /vendor/
            /bindings/
            /assets/fonts/
            /assets/font-rules/
            /assets/logo/
            /saved/blank2010.hwp
            /licenses/
            /mydocs/manual/
            /mydocs/tech/
            /ttfs/opensource/
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc
      - name: Prepare pinned Flutter SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'rhwp-flutter-sdk'
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $sdk checkout --detach $env:FLUTTER_VERSION_PIN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & (Join-Path $sdk 'bin/flutter.bat') precache --windows --no-ios --no-android --no-linux --no-macos --no-web
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "FLUTTER_ROOT=$sdk" >> $env:GITHUB_ENV
      - name: Actual Windows SDK, Flutter and compositor qualification
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ SDK is required' }
          $module = Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll'
          Import-Module $module
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if (!(Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'VS developer compiler PATH was not initialized' }
          $output = Join-Path $env:RUNNER_TEMP 'rhwp-windows-qualification'
          python -B bindings/Flutter/tool/check_windows_desktop_sdk.py --flutter-sdk $env:FLUTTER_ROOT --output $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve completed receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-desktop-qualification-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rhwp-windows-qualification/**/*.json
            ${{ runner.temp }}/rhwp-windows-qualification/**/*.log
            ${{ runner.temp }}/rhwp-windows-qualification/**/*.png
            ${{ runner.temp }}/rhwp-windows-qualification/continuous-capture/cpu-[123].rgba
            ${{ runner.temp }}/rhwp-windows-qualification/continuous-capture/cpu-32.rgba
            ${{ runner.temp }}/rhwp-windows-qualification/continuous-capture/cpu-reference-[123].rgba
            ${{ runner.temp }}/rhwp-windows-qualification/continuous-capture/cpu-reference-32.rgba
            ${{ runner.temp }}/rhwp-windows-qualification/continuous-capture/compositor-[123].rgba
            ${{ runner.temp }}/rhwp-windows-qualification/continuous-capture/compositor-32.rgba
            ${{ runner.temp }}/rhwp-windows-qualification/native-target/x86_64-pc-windows-msvc/release/rhwp_native_ffi.dll
            ${{ github.workspace }}/LICENSE
            ${{ github.workspace }}/THIRD_PARTY.md
            ${{ github.workspace }}/THIRD_PARTY_LICENSES.md
            ${{ github.workspace }}/licenses/
            ${{ github.workspace }}/assets/fonts/licenses/
          if-no-files-found: warn
          retention-days: 7

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    concurrency:
      group: desktop-qualification-macos-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_VERSION_PIN: c197ca5199e9ee5661e865596c9c07294dfab51c
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /.cargo/
            /src/
            /crates/
            /tools/
            /vendor/
            /bindings/
            /assets/fonts/
            /assets/font-rules/
            /assets/logo/
            /saved/blank2010.hwp
            /licenses/
            /mydocs/manual/
            /mydocs/tech/
            /ttfs/opensource/
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-darwin
      - name: Prepare pinned Flutter SDK and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/rhwp-flutter-sdk"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$sdk"
          git -C "$sdk" checkout --detach "$FLUTTER_VERSION_PIN"
          "$sdk/bin/flutter" precache --macos --no-ios --no-android --no-linux --no-windows --no-web
          echo "FLUTTER_ROOT=$sdk" >> "$GITHUB_ENV"
          framework=$(python3 -B bindings/Flutter/tool/find_macos_framework.py "$sdk")
          echo "FLUTTER_MACOS_FRAMEWORK=$framework" >> "$GITHUB_ENV"
      - name: Actual Apple SDK and Metal producer qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -B bindings/Flutter/tool/check_macos_metal_sdk.py \
            --flutter-sdk "$FLUTTER_ROOT" --flutter-framework "$FLUTTER_MACOS_FRAMEWORK" \
            --enable-metal-experiment --toolchain 1.93.1 \
            --output "$RUNNER_TEMP/rhwp-macos-qualification"
      - name: Actual AppKit Metal view and WindowServer qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          receipt="$RUNNER_TEMP/rhwp-macos-qualification/macos-sdk-receipt.json"
          native=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifacts"]["native"]["path"])' "$receipt")
          python3 -B bindings/Flutter/macos/tests/qualify_native_view.py build \
            --flutter-sdk "$FLUTTER_ROOT" --native "$native" --native-receipt "$receipt" \
            --output "$RUNNER_TEMP/rhwp-macos-qualification/desktop-build"
          python3 -B bindings/Flutter/macos/tests/qualify_native_view.py capture \
            --build-receipt "$RUNNER_TEMP/rhwp-macos-qualification/desktop-build/macos-view-build.json" \
            --frames 32 --timeout 600 --output "$RUNNER_TEMP/rhwp-macos-qualification/desktop-capture"
      - name: Preserve completed receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-metal-qualification-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rhwp-macos-qualification/**/*.json
            ${{ runner.temp }}/rhwp-macos-qualification/**/*.log
            ${{ runner.temp }}/rhwp-macos-qualification/**/*.png
            ${{ runner.temp }}/rhwp-macos-qualification/desktop-capture/cpu-[123].rgba
            ${{ runner.temp }}/rhwp-macos-qualification/desktop-capture/cpu-32.rgba
            ${{ runner.temp }}/rhwp-macos-qualification/desktop-capture/cpu-reference-[123].rgba
            ${{ runner.temp }}/rhwp-macos-qualification/desktop-capture/cpu-reference-32.rgba
            ${{ runner.temp }}/rhwp-macos-qualification/desktop-capture/compositor-[123].rgba
            ${{ runner.temp }}/rhwp-macos-qualification/desktop-capture/compositor-32.rgba
            ${{ runner.temp }}/rhwp-macos-qualification/native-target/aarch64-apple-darwin/debug/librhwp_native_ffi.dylib
            ${{ github.workspace }}/LICENSE
            ${{ github.workspace }}/THIRD_PARTY.md
            ${{ github.workspace }}/THIRD_PARTY_LICENSES.md
            ${{ github.workspace }}/licenses/
            ${{ github.workspace }}/assets/fonts/licenses/
          if-no-files-found: warn
          retention-days: 7
