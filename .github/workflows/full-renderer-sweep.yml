name: Full Renderer Sweep

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  full-renderer-sweep:
    name: Full Renderer Sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-full-renderer-sweep-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-full-renderer-sweep-cargo-
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rhwp-studio/package-lock.json

      - name: Install font packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core fonts-noto-mono fonts-nanum libfontconfig1-dev libfreetype6-dev
          fc-cache -f

      - name: Install studio dependencies
        working-directory: rhwp-studio
        run: npm ci

      - name: Install headless Chrome
        working-directory: rhwp-studio
        run: |
          npx @puppeteer/browsers install chrome@stable --path "$HOME/.cache/puppeteer"
          chrome_path="$(find "$HOME/.cache/puppeteer" -type f -path '*/chrome-linux64/chrome' | sort | tail -n 1)"
          if [ -z "$chrome_path" ]; then
            echo "Chrome executable not found under $HOME/.cache/puppeteer" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run native Skia full screenshot sweep
        run: cargo test-skia-full-sweep

      - name: Build WASM package
        run: wasm-pack build --target web --release

      - name: Build studio
        working-directory: rhwp-studio
        run: npm run build

      - name: Run browser full render sweep
        working-directory: rhwp-studio
        env:
          RHWP_RENDER_SAMPLE_SCOPE: full
        run: npm run e2e:ci

      - name: Capture representative multi-profile baseline
        run: python3 scripts/renderer_baseline.py --profiles screen,print,high-quality,fast-preview --browser-mode headless --output output/renderer-baseline/workflow-dispatch

      - name: Upload full renderer sweep artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-renderer-sweep-artifacts
          path: |
            output/layer-svg-diff/
            output/skia-diff/
            output/e2e/
            output/renderer-baseline/
            rhwp-studio/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
